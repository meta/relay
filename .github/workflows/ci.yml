name: CI

on: [push, pull_request]

jobs:
  vscode-extension-lint:
    name: VSCode Extension Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./vscode-extension
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: ESLint
        run: yarn --ignore-engines run lint
      - name: Prettier
        run: yarn --ignore-engines run prettier-check
      - name: Typecheck
        run: yarn --ignore-engines run typecheck

  js-tests:
    name: JS Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run tests
        run: yarn run jest

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    # The fixtures are compiled with the Relay compiler, and the suite refuses
    # to fall back to the published npm one when CI is set. Reuse the binary
    # build-compiler already produces rather than building a second copy --
    # that also keeps the pinned Rust toolchain in one place.
    needs: build-compiler
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "yarn"
      - name: Download artifact relay-bin-linux-x64
        uses: actions/download-artifact@v7
        with:
          name: relay-bin-linux-x64
          path: artifacts/linux-x64
      # upload-artifact does not preserve the executable bit.
      - name: Mark the compiler as executable
        run: chmod +x artifacts/linux-x64/relay
      # Deliberately not --ignore-scripts: the postinstall build produces
      # dist/babel-plugin-relay, which the fixtures are compiled with.
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      # The e2e package pins its own react and graphql, so it is not part of
      # the root workspace and installs separately.
      - name: Install e2e dependencies
        working-directory: ./packages/relay-e2e-test
        run: yarn install --frozen-lockfile
      - name: Run e2e tests
        env:
          RELAY_COMPILER_BINARY: ${{ github.workspace }}/artifacts/linux-x64/relay
        run: yarn test:e2e

  js-lint:
    name: JS Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: Test dependencies
        run: yarn run test-dependencies
      - name: Lint
        run: yarn run lint
      - name: Prettier
        run: yarn run prettier-check

  typecheck:
    name: Flow Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: Flow
        run: yarn run typecheck

  typecheck-typescript:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: TypeScript
        run: yarn run typecheck:ts

  build-tests:
    name: Rust Tests (${{ matrix.target.os }})
    strategy:
      matrix:
        target:
          - target: ubuntu-latest
            os: ubuntu-latest
            features: vendored
          - target: macos-latest
            os: macos-latest
          - target: windows-latest
            os: windows-latest
    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Free disk space
        if: matrix.target.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          # Should stay in sync with fbcode/buck2/rust-toolchain
          # And other similar references in this file and
          # docusaurus.yml
          toolchain: nightly-2026-04-11
          override: true
      - name: "Run tests"
        run: cargo test --manifest-path=compiler/Cargo.toml --locked ${{ matrix.target.features && '--features' }} ${{ matrix.target.features }}

  
  build-docs:
    name: Build docs (${{ matrix.target.os }})
    strategy:
      matrix:
        target:
          - target: ubuntu-latest
            os: ubuntu-latest
            features: vendored
    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.72.0
          override: true
      - name: "Build docs"
        run: cargo doc --manifest-path=compiler/Cargo.toml --locked ${{ matrix.target.features && '--features' }} ${{ matrix.target.features }}

  build-test-projects:
    name: Compiler output check (${{ matrix.target.os }})
    strategy:
      matrix:
        target:
          - target: ubuntu-latest
            os: ubuntu-latest
            features: vendored
          - target: macos-latest
            os: macos-latest
          # TODO: Fix windows build. It is failing on Resolvers
          # - target: windows-latest
          #   os: windows-latest
    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          # Should stay in sync with fbcode/buck2/rust-toolchain
          # And other similar references in this file and
          # docusaurus.yml
          toolchain: nightly-2026-04-11
          override: true
      - name: "Update fixture tests"
        run: ./scripts/update-fixtures.sh
      - name: "Build test project"
        run: cargo run --manifest-path=compiler/Cargo.toml --bin relay --release ${{ matrix.target.features && '--features' }} ${{ matrix.target.features }} ./compiler/test-project/relay.config.json
      - name: "Build Relay unit-test artifacts"
        run: cargo run --manifest-path=compiler/Cargo.toml --bin relay --release ${{ matrix.target.features && '--features' }} ${{ matrix.target.features }} ./scripts/config.tests.json
      - name: "Check working directory status"
        run: "./scripts/check-git-status.sh"

  rust-lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          # Should stay in sync with tools/third-party/rustfmt/.rustfmt-version
          # and the RUSTUP_TOOLCHAIN env var in the rustfmt step below
          toolchain: nightly-2026-07-05
          override: true
          components: rustfmt
      - name: "rustfmt"
        run: grep -r --include "*.rs" --files-without-match $'\x40generated' crates | xargs rustfmt --check --config="skip_children=true"
        working-directory: ./compiler/
        env:
          # Must match the toolchain installed above. This overrides
          # compiler/rust-toolchain.toml which would otherwise take precedence.
          RUSTUP_TOOLCHAIN: nightly-2026-07-05

  build-compiler:
    name: Build Rust Compiler (${{ matrix.target.os }})
    strategy:
      matrix:
        target:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            build-name: relay
            artifact-name: relay-bin-linux-x64
            packages: musl-tools
            features: vendored
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            build-name: relay
            artifact-name: relay-bin-linux-arm64
            features: vendored
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            build-name: relay
            artifact-name: relay-bin-macos-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            build-name: relay
            artifact-name: relay-bin-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            build-name: relay.exe
            artifact-name: relay-bin-win-x64
    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          # Should stay in sync with fbcode/buck2/rust-toolchain
          # And other similar references in this file and
          # docusaurus.yml
          toolchain: nightly-2026-04-11
          override: true
          target: ${{ matrix.target.target }}
      - uses: actions/setup-node@v6
        if: github.event_name == 'push' && github.repository == 'meta/relay' && github.ref == 'refs/heads/main'
        with:
          node-version: 24.x
          cache: "yarn"
      - name: Install dependencies
        if: github.event_name == 'push' && github.repository == 'meta/relay' && github.ref == 'refs/heads/main'
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: Set the compiler version when releasing the `main` branch
        if: github.event_name == 'push' && github.repository == 'meta/relay' && github.ref == 'refs/heads/main'
        run: yarn gulp setCompilerMainVersion
        env:
          RELEASE_COMMIT_SHA: ${{ github.sha }}
      - name: Install packages
        if: matrix.target.os == 'ubuntu-latest' && matrix.target.packages
        run: sudo apt install ${{ matrix.target.packages }} -y
      - name: Install cross
        if: matrix.target.cross
        uses: actions-rs/cargo@v1
        with:
          command: install
          args: cross
      # actions-rs/toolchain@v1 is deprecated and no longer reliably installs the
      # requested `target` (e.g. cross-compiling x86_64-apple-darwin on the
      # Apple-Silicon macos-latest runner fails with "can't find crate for `std`").
      # Explicitly add the target for non-cross builds (cross handles its own
      # targets in a container). Run from compiler/ so the toolchain pinned in
      # compiler/rust-toolchain.toml is the one that receives the target.
      - name: Add rust target
        if: ${{ !matrix.target.cross }}
        working-directory: compiler
        run: rustup target add ${{ matrix.target.target }}
      # Current published version of cross only works correctly if run from compiler directory
      # See related issue https://github.com/cross-rs/cross/issues/615
      # actions-rs/cargo@v1 does not support this option https://github.com/actions-rs/cargo/pull/59
      # Either we need to install cross from git or manually run cargo / cross instead of using action
      - name: Build project
        working-directory: compiler
        run: ${{ matrix.target.cross && 'cross' || 'cargo' }} build --release --target ${{ matrix.target.target }} ${{ matrix.target.features && '--features' }} ${{ matrix.target.features }}
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target.artifact-name }}
          path: compiler/target/${{ matrix.target.target }}/release/${{ matrix.target.build-name }}

  main-release:
    name: Publish to NPM
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.repository == 'meta/relay' && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))
    needs: [js-tests, js-lint, typecheck, build-tests, build-compiler, e2e-tests]
    environment: npm-publish
    permissions:
      contents: read   # Required for actions/checkout
      id-token: write  # Required for trusted publishing to NPM
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: Download artifact relay-bin-linux-x64
        uses: actions/download-artifact@v7
        with:
          name: relay-bin-linux-x64
          path: artifacts/linux-x64
      - name: Download artifact relay-bin-linux-arm64
        uses: actions/download-artifact@v7
        with:
          name: relay-bin-linux-arm64
          path: artifacts/linux-arm64
      - name: Download artifact relay-bin-macos-x64
        uses: actions/download-artifact@v7
        with:
          name: relay-bin-macos-x64
          path: artifacts/macos-x64
      - name: Download artifact relay-bin-macos-arm64
        uses: actions/download-artifact@v7
        with:
          name: relay-bin-macos-arm64
          path: artifacts/macos-arm64
      - name: Download artifact relay-bin-win-x64
        uses: actions/download-artifact@v7
        with:
          name: relay-bin-win-x64
          path: artifacts/win-x64
      - name: Mark binaries as executable
        working-directory: artifacts
        run: |
          chmod +x linux-x64/relay
          chmod +x linux-arm64/relay
          chmod +x macos-x64/relay
          chmod +x macos-arm64/relay

      - name: Build latest (main) version
        if: github.ref == 'refs/heads/main'
        run: yarn gulp mainrelease
        env:
          RELEASE_COMMIT_SHA: ${{ github.sha }}

      - name: Build release version
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        run: yarn gulp release

      - name: Ensure npm 11.5.1 or later for trusted publishing
        run: npm install -g npm@11.7.0

      - name: Publish to npm
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        run: |
          for pkg in dist/*; do
            npm publish "./$pkg" ${TAG}
          done
        env:
          TAG: ${{ github.ref == 'refs/heads/main' && '--tag=main' || ((contains(github.ref_name, '-rc.') && '--tag=dev') || '' )}}
